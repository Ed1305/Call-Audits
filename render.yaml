services:
  - type: web
    name: callaudit
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LISTEN_MODE
        value: audio
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: ALLOW_DEMO_FALLBACK
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/callaudit.json
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: KEEP_AUDIO
        value: "false"
      - key: PROCESSOR_ENABLED
        value: "false"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
